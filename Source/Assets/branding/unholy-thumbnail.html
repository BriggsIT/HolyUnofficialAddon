<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unholy Addon thumbnail</title>
<!--
  The Unholy Addon thumbnail (1920 x 1080), the counterpart of The Holy Expansion's: where Holy has a blue sky, white
  clouds and sun rays from above, this has a smoky red sky, cartoon smoke clouds lit from below, flames and rays rising
  from the fire, and embers. The title is unholy-addon-title.png (render unholy-title.html first).
  Render with: .\render-title.ps1 -Page unholy-thumbnail.html -Out unholy-addon-thumbnail.png -Width 1920 -Height 1080 -Pad 0
-->
<style>
  html, body { margin: 0; padding: 0; background: #14030a; }
  body { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  svg { display: block; }
  #title { position: absolute; left: 110px; top: 362px; width: 1700px; }
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14030a"/>
      <stop offset="0.4" stop-color="#3a0710"/>
      <stop offset="0.78" stop-color="#851710"/>
      <stop offset="1" stop-color="#c2330f"/>
    </linearGradient>
    <radialGradient id="glow" cx="960" cy="1130" r="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd760" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#ff8a24" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#d23414" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d23414" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="1080" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb850" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#ff7a2a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.3" stop-color="#ffab2e"/>
      <stop offset="0.7" stop-color="#f2491b"/>
      <stop offset="1" stop-color="#b3150f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffb43a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Smoke, darker towards the top of the picture (the fire lights it from below). -->
    <linearGradient id="smokeHot" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a070e"/>
      <stop offset="0.55" stop-color="#5a141b"/>
      <stop offset="1" stop-color="#93301f"/>
    </linearGradient>
    <linearGradient id="smokeDim" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c0810"/>
      <stop offset="0.6" stop-color="#4e1219"/>
      <stop offset="1" stop-color="#7a2420"/>
    </linearGradient>
    <filter id="emberGlow"x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g id="rays"></g>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <g id="far"></g>
  <g id="flames"></g>
  <g id="near"></g>
  <g id="embers" filter="url(#emberGlow)"></g>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
<img id="title" src="unholy-addon-title.png" alt="">
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  // Seeded, so every render is the same picture.
  var seed = 7;
  function rnd() {
    seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  // Rays rising from the fire below.
  var rays = document.getElementById('rays');
  for (var i = 0; i < 13; i++) {
    var mid = -78 + i * 13 + (rnd() - 0.5) * 4, half = 2.2 + rnd() * 2.6;
    var ox = 960, oy = 1160, len = 1500;
    function pt(deg) { var a = deg * Math.PI / 180; return (ox + Math.sin(a) * len) + ',' + (oy - Math.cos(a) * len); }
    el('polygon', { points: ox + ',' + oy + ' ' + pt(mid - half) + ' ' + pt(mid + half), fill: 'url(#ray)' }, rays);
  }

  // Cartoon smoke clouds: puffs (x, y, r) and flat bottoms (x, y, w, h), each drawn three times: a fire-lit rim
  // showing below, the body, and a faint shade over the top of each puff (the light comes from below). Each layer is
  // one group, so overlapping puffs merge into one shape.
  function cloud(parent, puffs, bases, look) {
    var layers = [
      { attrs: { fill: look.rim }, dy: look.rimDy, dr: look.rimDr, k: 1 },
      { attrs: { fill: look.body }, dy: 0, dr: 0, k: 1 },
      { attrs: { fill: '#12030a', opacity: look.shade }, dy: -look.shadeDy, dr: 0, k: 0.86 }
    ];
    layers.forEach(function (L) {
      var g = el('g', L.attrs, parent);
      puffs.forEach(function (p) { el('circle', { cx: p[0], cy: p[1] + L.dy, r: Math.max(1, p[2] * L.k + L.dr) }, g); });
      if (L.k === 1) bases.forEach(function (b) {
        el('rect', { x: b[0] - L.dr, y: b[1] + L.dy, width: b[2] + 2 * L.dr, height: b[3] + L.dr, rx: (b[3] + L.dr) / 2 }, g);
      });
    });
  }
  var hot = { rim: '#ffa04a', body: 'url(#smokeHot)', shade: 0.32, rimDy: 13, rimDr: 5, shadeDy: 26 };
  var warm = { rim: '#ee6a2c', body: 'url(#smokeHot)', shade: 0.28, rimDy: 10, rimDr: 4, shadeDy: 18 };
  var dim = { rim: '#b8461f', body: 'url(#smokeDim)', shade: 0.3, rimDy: 9, rimDr: 3, shadeDy: 20 };

  var far = document.getElementById('far'), near = document.getElementById('near');
  // Far: the small floating ones.
  cloud(far, [[1545, 250, 58], [1625, 208, 80], [1725, 228, 64], [1795, 262, 44], [1488, 282, 38]], [[1452, 262, 380, 46]], dim);
  cloud(far, [[565, 742, 44], [645, 712, 60], [735, 726, 50], [808, 752, 34]], [[528, 735, 316, 42]], warm);
  cloud(far, [[1290, 818, 34], [1350, 796, 46], [1418, 810, 36]], [[1262, 812, 190, 32]], warm);
  // Top left.
  cloud(near, [[-30, 110, 160], [130, 40, 130], [270, 110, 105], [380, 185, 72], [90, 210, 120], [235, 225, 92], [-20, 280, 110], [455, 228, 40]], [], dim);
  // Right bank.
  cloud(near, [[1900, 300, 150], [1770, 430, 108], [1905, 520, 165], [1690, 600, 100], [1830, 700, 150], [1625, 790, 108], [1905, 860, 180], [1735, 935, 150], [1560, 965, 120]], [], hot);
  // Left bank.
  cloud(near, [[30, 520, 135], [175, 640, 104], [10, 720, 160], [245, 800, 120], [85, 905, 170], [345, 950, 135]], [], hot);
  // Bottom, with the fire showing between.
  cloud(near, [[520, 1075, 125], [690, 1045, 105], [860, 1090, 120], [1060, 1088, 112], [1240, 1048, 102], [1410, 1080, 125]], [], hot);

  // Flames behind the bottom clouds.
  var flames = document.getElementById('flames');
  // A cartoon flame tongue: a round belly that bulges out, then sweeps in to a curled tip.
  function flame(x, b, w, h, lean, fill, parent) {
    var d = 'M' + (x - w / 2) + ',' + b +
      ' C' + (x - w * 0.66) + ',' + (b - h * 0.32) + ' ' + (x - w * 0.12) + ',' + (b - h * 0.5) + ' ' + (x + lean) + ',' + (b - h) +
      ' C' + (x + w * 0.1 + lean * 0.45) + ',' + (b - h * 0.6) + ' ' + (x + w * 0.66) + ',' + (b - h * 0.38) + ' ' + (x + w / 2) + ',' + b + ' Z';
    el('path', { d: d, fill: fill }, parent);
  }
  var back = el('g', { filter: 'url(#soft)', opacity: '0.8' }, flames);
  var front = el('g', {}, flames);
  for (var x = 330; x <= 1610; x += 95 + rnd() * 45) {
    var dist = Math.abs(x - 960) / 700, h = (420 - dist * 190) * (0.75 + rnd() * 0.4), w = 170 + rnd() * 80;
    var lean = (rnd() - 0.5) * 2 * (0.25 * w);
    flame(x, 1110, w * 1.3, h * 1.18, lean, 'url(#flame)', back);
    flame(x, 1110, w, h, lean, 'url(#flame)', front);
    flame(x + lean * 0.08, 1110, w * 0.52, h * 0.56, lean * 0.55, 'url(#core)', front);
  }

  // Embers drifting up, most of them low down.
  var embers = document.getElementById('embers');
  for (var n = 0; n < 90; n++) {
    var ex = 60 + rnd() * 1800, ey = 1070 - 1000 * Math.pow(rnd(), 1.7), er = 1.6 + rnd() * 3.6;
    el('circle', { cx: ex, cy: ey, r: er, fill: rnd() < 0.5 ? '#ffc65c' : '#ff8a2e', opacity: (0.55 + rnd() * 0.45).toFixed(2) }, embers);
  }
})();
</script>
</body>
</html>
