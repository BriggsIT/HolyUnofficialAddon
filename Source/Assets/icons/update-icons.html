<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Update icons</title>
<!--
  Icons of the addon's update types, in the style of the game's Updates & Addons icons (an object and a badge).
  Render with: ..\logos\render-logos.ps1 -Page ..\icons\update-icons.html -Size 128 -NoJson   (PNGs go to png\)
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #sheet { display: grid; grid-template-columns: repeat(8, 128px); grid-auto-rows: 128px; }
  #sheet svg { width: 128px; height: 128px; display: block; }
  #meta { display: none; }
</style>
</head>
<body>
<div id="sheet"></div>
<pre id="meta"></pre>
<script>
const O = '#1c1d24';
const ICONS = [];
const add = (id, svg) => ICONS.push({ id, name: id, svg });
const shadow = p => `<filter id="${p}sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".4"/></filter>`;
const stops = list => list.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('');
const lg = (id, list, d = [0, 0, 0, 1]) => `<linearGradient id="${id}" x1="${d[0]}" y1="${d[1]}" x2="${d[2]}" y2="${d[3]}">${stops(list)}</linearGradient>`;

// The green badge the game's icons use: a circle with a plus, or with an arrow.
function badge(p, x, y, kind, col = ['#7ee05a', '#2f9a1c']) {
  const sym = kind === 'plus'
    ? `<path d="M${x - 9} ${y} H${x + 9} M${x} ${y - 9} V${y + 9}" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`
    : kind === 'check'
    ? `<path d="M${x - 9} ${y + 1} L${x - 3} ${y + 8} L${x + 9} ${y - 7}" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`
    : kind === 'up'
      ? `<path d="M${x} ${y + 10} V${y - 7} M${x - 9} ${y + 1} L${x} ${y - 9} L${x + 9} ${y + 1}" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`
      : `<path d="M${x} ${y - 10} V${y + 7} M${x - 9} ${y - 1} L${x} ${y + 9} L${x + 9} ${y - 1}" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  return `<defs>${lg(p + 'bd', [[0, col[0]], [1, col[1]]])}</defs>
<circle cx="${x}" cy="${y}" r="21" fill="url(#${p}bd)" stroke="${O}" stroke-width="4"/>
<ellipse cx="${x - 5}" cy="${y - 9}" rx="11" ry="6" fill="#fff" fill-opacity=".35"/>${sym}`;
}

/* Port: a game going to another console */
add('update-port', `
<defs>${shadow('po')}${lg('poA', [[0, '#5f6878'], [1, '#2b3039']])}${lg('poB', [[0, '#ffffff'], [1, '#c9d0da']])}${lg('poS', [[0, '#6ec8ff'], [1, '#2a7ad0']])}</defs>
<g filter="url(#posh)">
  <rect x="10" y="22" width="62" height="40" rx="7" fill="url(#poA)" stroke="${O}" stroke-width="4"/>
  <rect x="18" y="32" width="30" height="5" rx="2.5" fill="#15181d"/>
  <circle cx="60" cy="50" r="4" fill="#7ee05a"/>
  <rect x="38" y="56" width="70" height="44" rx="8" fill="url(#poB)" stroke="${O}" stroke-width="4"/>
  <rect x="47" y="67" width="34" height="6" rx="3" fill="#8a94a3"/>
  <circle cx="96" cy="88" r="4.5" fill="#2a7ad0"/>
  <path d="M30 70 Q30 86 46 86" stroke="url(#poS)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M42 78 L50 86 L42 94" stroke="#2a7ad0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
${badge('po', 100, 32, 'plus')}
`);

/* Engine update: a gear with an up arrow */
add('update-engine', (() => {
  const teeth = [];
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5;
    teeth.push(`<rect x="-7" y="-50" width="14" height="18" rx="3" transform="translate(56 66) rotate(${(a * 180 / Math.PI).toFixed(1)})"/>`);
  }
  return `
<defs>${shadow('en')}${lg('enM', [[0, '#e9eef3'], [0.5, '#9aa6b2'], [1, '#5a6672']])}</defs>
<g filter="url(#ensh)">
  <g fill="url(#enM)" stroke="${O}" stroke-width="4" stroke-linejoin="round">${teeth.join('')}</g>
  <circle cx="56" cy="66" r="36" fill="url(#enM)" stroke="${O}" stroke-width="4"/>
  <g fill="url(#enM)">${teeth.join('')}</g>
  <circle cx="56" cy="66" r="34" fill="url(#enM)"/>
  <circle cx="56" cy="66" r="15" fill="#2b3039" stroke="${O}" stroke-width="4"/>
  <path d="M30 50 A30 30 0 0 1 64 36" stroke="#fff" stroke-opacity=".7" stroke-width="4" fill="none" stroke-linecap="round"/>
</g>
${badge('en', 100, 32, 'up')}
`;
})());

/* New gameplay features: a puzzle piece with a plus */
add('update-features', `
<defs>${shadow('fe')}${lg('feA', [[0, '#ffc25a'], [1, '#e8761c']])}${lg('feB', [[0, '#7cc4ff'], [1, '#2a6fd0']])}</defs>
<g filter="url(#fesh)">
  <path d="M14 46 H34 C30 36 36 28 44 28 C52 28 58 36 54 46 H74 V66 C84 62 92 68 92 76 C92 84 84 90 74 86 V106 H14 Z" fill="url(#feA)" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M20 52 H34" stroke="#fff" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>
  <path d="M54 72 h22 v-6 c0 -6 6 -10 12 -10 c6 0 12 4 12 10 v6 h12 v38 h-58 Z" fill="url(#feB)" stroke="${O}" stroke-width="4" stroke-linejoin="round" transform="translate(-6 -2)"/>
</g>
${badge('fe', 100, 32, 'plus')}
`);

/* Age rating edit: rating labels with a down arrow */
add('update-rating', `
<defs>${shadow('ra')}${lg('raR', [[0, '#ff6b6b'], [1, '#c4161c']])}${lg('raG', [[0, '#7ee05a'], [1, '#2f9a1c']])}</defs>
<g filter="url(#rash)">
  <rect x="12" y="22" width="56" height="56" rx="10" fill="url(#raR)" stroke="${O}" stroke-width="4"/>
  <text x="40" y="62" text-anchor="middle" font-family="'Arial Black', Bahnschrift, sans-serif" font-weight="900" font-size="30" fill="#fff">18</text>
  <rect x="44" y="52" width="58" height="58" rx="10" fill="url(#raG)" stroke="${O}" stroke-width="4"/>
  <text x="73" y="94" text-anchor="middle" font-family="'Arial Black', Bahnschrift, sans-serif" font-weight="900" font-size="31" fill="#fff">12</text>
</g>
${badge('ra', 102, 30, 'down', ['#7cc4ff', '#1f6ad0'])}
`);

/* ---- Copy protection technologies ---- */

// A gold key lying at (x, y), turned by `turn` degrees.
const key = (p, x, y, turn) => `<defs>${lg(p + 'k', [[0, '#ffe680'], [1, '#c48a00']])}</defs>
<g transform="translate(${x} ${y}) rotate(${turn})" stroke="${O}" stroke-width="3.5" stroke-linejoin="round">
  <rect x="8" y="-4.5" width="34" height="9" rx="2" fill="url(#${p}k)"/>
  <path d="M30 4 v8 h6 v-8 M20 4 v6 h5 v-6" fill="url(#${p}k)"/>
  <circle cx="0" cy="0" r="13" fill="url(#${p}k)"/>
  <circle cx="0" cy="0" r="4.5" fill="#6a4a00" stroke-width="2"/>
</g>`;

/* Disk check: a floppy disk, checked */
add('cp-disk', `
<defs>${shadow('cd')}${lg('cdB', [[0, '#4a82e0'], [1, '#1c3f86']])}${lg('cdM', [[0, '#f1f4f7'], [1, '#8e9aa6']])}</defs>
<g filter="url(#cdsh)">
  <path d="M14 30 Q14 24 20 24 H90 L102 36 V100 Q102 106 96 106 H20 Q14 106 14 100 Z" fill="url(#cdB)" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
  <rect x="32" y="24" width="46" height="30" rx="3" fill="url(#cdM)" stroke="${O}" stroke-width="3.5"/>
  <rect x="62" y="30" width="10" height="18" rx="2" fill="#2b3039"/>
  <rect x="26" y="66" width="64" height="36" rx="4" fill="#f6f2e4" stroke="${O}" stroke-width="3"/>
  <path d="M34 77 H82 M34 85 H76 M34 93 H68" stroke="#9aa3b0" stroke-width="3" stroke-linecap="round"/>
</g>
${badge('cd', 100, 30, 'check')}
`);

/* Code wheel and serial key: a two-part code wheel and a key */
add('cp-codewheel', (() => {
  let ticks = '';
  for (let i = 0; i < 16; i++) {
    const a = i * Math.PI / 8, c = Math.cos(a), s = Math.sin(a);
    ticks += `<path d="M${(54 + 33 * c).toFixed(1)} ${(60 + 33 * s).toFixed(1)} L${(54 + 43 * c).toFixed(1)} ${(60 + 43 * s).toFixed(1)}"/>`;
  }
  return `
<defs>${shadow('cw')}${lg('cwO', [[0, '#fff4d6'], [1, '#e2b866']])}${lg('cwI', [[0, '#6ec8ff'], [1, '#2a6fd0']])}</defs>
<g filter="url(#cwsh)">
  <circle cx="54" cy="60" r="46" fill="url(#cwO)" stroke="${O}" stroke-width="4"/>
  <g stroke="#b07a2a" stroke-width="2.5">${ticks}</g>
  <circle cx="54" cy="60" r="30" fill="url(#cwI)" stroke="${O}" stroke-width="3.5"/>
  <path d="M54 60 L54 30 A30 30 0 0 1 75 39 Z" fill="#fff4d6" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="60" r="6" fill="#2b3039"/>
</g>
${key('cw', 96, 96, -40)}
`;
})());

/* Disc fingerprint: a disc with a fingerprint */
add('cp-fingerprint', `
<defs>${shadow('fp')}${lg('fpD', [[0, '#f3f5f8'], [0.35, '#d9e8ff'], [0.55, '#f6dcf2'], [0.75, '#dff5e6'], [1, '#aeb8c4']], [0, 0, 1, 1])}${lg('fpB', [[0, '#7cc4ff'], [1, '#1f6ad0']])}</defs>
<g filter="url(#fpsh)">
  <circle cx="52" cy="58" r="44" fill="url(#fpD)" stroke="${O}" stroke-width="4"/>
  <circle cx="52" cy="58" r="15" fill="#e6eaef" stroke="${O}" stroke-width="2.5"/>
  <circle cx="52" cy="58" r="6" fill="#3a3f48"/>
  <path d="M24 40 A34 34 0 0 1 48 25" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
</g>
<circle cx="96" cy="94" r="25" fill="url(#fpB)" stroke="${O}" stroke-width="4"/>
<g stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round">
  <path d="M86 104 Q84 86 96 84 Q108 86 106 104"/><path d="M91 106 Q89 91 96 90 Q103 91 101 106"/>
  <path d="M96 96 V108"/><path d="M81 96 Q82 78 96 76 Q110 78 111 96"/>
</g>
`);

/* Online activation: a screen with the world on it, and a key */
add('cp-activation', `
<defs>${shadow('oa')}${lg('oaS', [[0, '#6ec8ff'], [1, '#1f5fb8']])}${lg('oaC', [[0, '#5f6878'], [1, '#2b3039']])}</defs>
<g filter="url(#oash)">
  <rect x="10" y="20" width="88" height="64" rx="7" fill="url(#oaC)" stroke="${O}" stroke-width="4"/>
  <rect x="17" y="27" width="74" height="50" rx="3" fill="url(#oaS)"/>
  <path d="M44 84 L40 98 H68 L64 84 Z" fill="url(#oaC)" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="32" y="96" width="44" height="7" rx="3" fill="url(#oaC)" stroke="${O}" stroke-width="3.5"/>
  <g stroke="#fff" stroke-width="2.6" fill="none"><circle cx="54" cy="52" r="17"/><ellipse cx="54" cy="52" rx="7.5" ry="17"/><path d="M37 52 H71 M40 43 H68 M40 61 H68"/></g>
</g>
${key('oa', 92, 92, -35)}
`);

/* Always-online DRM: a cloud with a padlock */
add('cp-alwaysonline', `
<defs>${shadow('ao')}${lg('aoC', [[0, '#ffffff'], [1, '#bcd8f5']])}${lg('aoL', [[0, '#ffe680'], [1, '#c48a00']])}${lg('aoM', [[0, '#f1f4f7'], [1, '#8e9aa6']])}</defs>
<g filter="url(#aosh)">
  <path d="M28 82 C12 82 8 62 22 56 C20 38 40 30 52 40 C58 24 86 24 90 44 C108 42 114 64 102 74 C99 80 92 82 86 82 Z" fill="url(#aoC)" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#2a7ad0" stroke-width="4" fill="none" stroke-linecap="round"><path d="M36 64 A16 16 0 0 1 62 52"/><path d="M42 68 A9 9 0 0 1 56 60"/></g>
  <circle cx="48" cy="72" r="3.5" fill="#2a7ad0"/>
  <path d="M74 80 V70 A13 13 0 0 1 100 70 V80" stroke="${O}" stroke-width="9" fill="none"/>
  <path d="M74 80 V70 A13 13 0 0 1 100 70 V80" stroke="url(#aoM)" stroke-width="4" fill="none"/>
  <rect x="66" y="78" width="42" height="32" rx="6" fill="url(#aoL)" stroke="${O}" stroke-width="4"/>
  <circle cx="87" cy="91" r="4.5" fill="#6a4a00"/><path d="M87 94 V102" stroke="#6a4a00" stroke-width="4" stroke-linecap="round"/>
</g>
`);

/* ---- MMO management ---- */

// A gear: teeth drawn with an outline, then the body and teeth again on top to hide the inner outlines.
const gear = (cx, cy, r, n, fill) => {
  const tw = r * 0.42, th = r * 0.42;
  let t = '';
  for (let i = 0; i < n; i++) {
    t += `<rect x="${(-tw / 2).toFixed(1)}" y="${(-r - th + 5).toFixed(1)}" width="${tw.toFixed(1)}" height="${th.toFixed(1)}" rx="2.5" transform="translate(${cx} ${cy}) rotate(${(i * 360 / n).toFixed(1)})"/>`;
  }
  return `<g fill="${fill}" stroke="${O}" stroke-width="4" stroke-linejoin="round">${t}</g>
<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${O}" stroke-width="4"/>
<g fill="${fill}">${t}</g><circle cx="${cx}" cy="${cy}" r="${r - 2}" fill="${fill}"/>
<circle cx="${cx}" cy="${cy}" r="${(r * 0.38).toFixed(1)}" fill="#2b3039" stroke="${O}" stroke-width="3.5"/>`;
};

/* The window: the world, and a server */
add('mmo-window', `
<defs>${shadow('mw')}${lg('mwO', [[0, '#7cd0ff'], [1, '#1f5fb8']])}${lg('mwL', [[0, '#9be36a'], [1, '#3f9a22']])}${lg('mwS', [[0, '#6a7384'], [1, '#2b3039']])}</defs>
<g filter="url(#mwsh)">
  <circle cx="54" cy="54" r="44" fill="url(#mwO)" stroke="${O}" stroke-width="4"/>
  <g fill="url(#mwL)" stroke="${O}" stroke-width="3" stroke-linejoin="round">
    <path d="M26 36 C34 24 52 26 56 36 C60 46 48 50 46 58 C43 68 30 68 25 56 C21 48 21 42 26 36 Z"/>
    <path d="M62 58 C70 52 86 56 88 66 C90 78 80 88 70 84 C63 80 57 66 62 58 Z"/>
    <path d="M62 22 C72 16 86 24 84 34 C80 40 68 36 62 22 Z"/>
  </g>
  <path d="M22 40 A34 34 0 0 1 42 18" stroke="#fff" stroke-opacity=".75" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <rect x="68" y="64" width="48" height="54" rx="6" fill="url(#mwS)" stroke="${O}" stroke-width="4"/>
  <g fill="#15181d"><rect x="75" y="73" width="34" height="9" rx="2"/><rect x="75" y="87" width="34" height="9" rx="2"/><rect x="75" y="101" width="34" height="9" rx="2"/></g>
  <circle cx="103" cy="77.5" r="2.6" fill="#7ee05a"/><circle cx="103" cy="91.5" r="2.6" fill="#7ee05a"/><circle cx="103" cy="105.5" r="2.6" fill="#ffd24a"/>
  <path d="M80 77.5 H94 M80 91.5 H94 M80 105.5 H94" stroke="#4a5262" stroke-width="2.5" stroke-linecap="round"/>
</g>
`);

/* Graphics overhaul: a landscape picture and a paintbrush */
add('mmo-graphics', `
<defs>${shadow('mg')}${lg('mgF', [[0, '#ffd77a'], [1, '#c48a00']])}${lg('mgS', [[0, '#9fdcff'], [1, '#3d8ee0']])}${lg('mgM', [[0, '#9be36a'], [1, '#2f8a1c']])}${lg('mgH', [[0, '#c98a4a'], [1, '#7a4a1c']])}${lg('mgC', [[0, '#f1f4f7'], [1, '#8e9aa6']])}</defs>
<g filter="url(#mgsh)">
  <rect x="8" y="24" width="84" height="66" rx="6" fill="url(#mgF)" stroke="${O}" stroke-width="4"/>
  <rect x="17" y="33" width="66" height="48" rx="2" fill="url(#mgS)" stroke="${O}" stroke-width="2.5"/>
  <circle cx="68" cy="47" r="7" fill="#ffe14a" stroke="${O}" stroke-width="2.5"/>
  <path d="M17 81 L38 54 L50 68 L60 58 L83 81 Z" fill="url(#mgM)" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>
  <path d="M38 54 L43 61 L34 66 Z" fill="#fff" fill-opacity=".8"/>
  <g transform="translate(70 100) rotate(45)">
    <rect x="-6" y="-50" width="12" height="40" rx="5" fill="url(#mgH)" stroke="${O}" stroke-width="3.5"/>
    <rect x="-8.5" y="-13" width="17" height="13" rx="2" fill="url(#mgC)" stroke="${O}" stroke-width="3.5"/>
    <path d="M-8 0 H8 L7 14 Q0 26 -7 14 Z" fill="#e8463a" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
</g>
${badge('mg', 102, 28, 'up')}
`);

/* 64-bit client: a chip with 64 on it */
add('mmo-client64', (() => {
  let pins = '';
  for (let k = 0; k < 4; k++) {
    const a = 33 + k * 13;
    pins += `<rect x="${a}" y="16" width="7" height="14" rx="2"/><rect x="${a}" y="96" width="7" height="14" rx="2"/>`;
    pins += `<rect x="8" y="${a + 3}" width="14" height="7" rx="2"/><rect x="88" y="${a + 3}" width="14" height="7" rx="2"/>`;
  }
  return `
<defs>${shadow('mc')}${lg('mcB', [[0, '#3c4656'], [1, '#161a22']])}${lg('mcI', [[0, '#f1f4f7'], [1, '#9aa6b2']])}${lg('mcP', [[0, '#ffe680'], [1, '#c48a00']])}</defs>
<g filter="url(#mcsh)">
  <g fill="url(#mcP)" stroke="${O}" stroke-width="2.5">${pins}</g>
  <rect x="20" y="28" width="70" height="70" rx="8" fill="url(#mcB)" stroke="${O}" stroke-width="4"/>
  <rect x="30" y="38" width="50" height="50" rx="5" fill="url(#mcI)" stroke="${O}" stroke-width="2.5"/>
  <text x="55" y="74" text-anchor="middle" font-family="'Arial Black', Bahnschrift, sans-serif" font-weight="900" font-size="27" fill="${O}">64</text>
  <circle cx="28" cy="36" r="2.5" fill="#7ee05a"/>
</g>
${badge('mc', 104, 28, 'up')}
`;
})());

/* Engine migration: an old gear handing over to a new one */
add('mmo-migration', `
<defs>${shadow('mm')}${lg('mmO', [[0, '#c9ced6'], [1, '#6c7480']])}${lg('mmN', [[0, '#ffe680'], [1, '#d08a00']])}${lg('mmA', [[0, '#6ec8ff'], [1, '#2a7ad0']])}</defs>
<g filter="url(#mmsh)">
  ${gear(36, 42, 20, 8, 'url(#mmO)')}
  ${gear(80, 84, 27, 10, 'url(#mmN)')}
  <path d="M14 70 Q16 98 44 102" stroke="url(#mmA)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M38 94 L46 102 L38 110" stroke="#2a7ad0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 64 A27 27 0 0 1 84 58" stroke="#fff" stroke-opacity=".8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</g>
${badge('mm', 102, 28, 'up')}
`);

/* World expansion: a map with a route, and a plus */
add('mmo-expansion', `
<defs>${shadow('me')}${lg('meP', [[0, '#fbefcf'], [1, '#e2c88a']])}</defs>
<g filter="url(#mesh)">
  <path d="M8 46 L36 36 L66 46 L96 36 V104 L66 114 L36 104 L8 114 Z" fill="url(#meP)" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M36 36 V104 L66 114 V46 Z" fill="#000" fill-opacity=".08"/>
  <path d="M36 36 V104 M66 46 V114" stroke="#b08a4a" stroke-width="3"/>
  <g fill="#8fcf5a" fill-opacity=".85" stroke="#4f8a2a" stroke-width="2"><path d="M14 60 Q22 52 30 58 Q34 66 26 72 Q16 72 14 60 Z"/><path d="M70 80 Q80 72 90 80 Q92 92 80 94 Q70 92 70 80 Z"/><path d="M44 56 Q52 50 58 56 Q58 64 50 64 Q44 62 44 56 Z"/></g>
  <path d="M18 100 Q30 78 46 84 T82 58" stroke="#c4161c" stroke-width="3.5" stroke-dasharray="5 5" fill="none" stroke-linecap="round"/>
  <path d="M77 52 L89 64 M89 52 L77 64" stroke="#c4161c" stroke-width="5.5" stroke-linecap="round"/>
</g>
${badge('me', 102, 28, 'plus')}
`);

/* Content patch: a scroll with a seal */
add('mmo-patch', `
<defs>${shadow('mp')}${lg('mpP', [[0, '#fbefcf'], [1, '#e2c88a']])}${lg('mpR', [[0, '#f3dca6'], [0.5, '#c9a35a'], [1, '#9a7a3a']])}${lg('mpW', [[0, '#ff6b6b'], [1, '#b0121a']])}</defs>
<g filter="url(#mpsh)">
  <rect x="22" y="30" width="64" height="76" rx="3" fill="url(#mpP)" stroke="${O}" stroke-width="4"/>
  <g stroke="#9a7a4a" stroke-width="3.5" stroke-linecap="round"><path d="M32 50 H76"/><path d="M32 60 H70"/><path d="M32 70 H76"/><path d="M32 80 H58"/></g>
  <rect x="12" y="20" width="84" height="17" rx="8.5" fill="url(#mpR)" stroke="${O}" stroke-width="4"/>
  <rect x="12" y="99" width="84" height="17" rx="8.5" fill="url(#mpR)" stroke="${O}" stroke-width="4"/>
  <circle cx="72" cy="88" r="9" fill="url(#mpW)" stroke="${O}" stroke-width="3"/>
  <path d="M68 88 L71 91 L76 85" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
${badge('mp', 102, 28, 'plus')}
`);

/* Expansion pack (the game's MMO addon): a big box with a star */
add('mmo-addon', `

/* User reviews: a speech bubble with stars */
add('store-f0', (() => {
  const star = (cx, cy, r, fill) => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1); } return `<path d="${d}Z" fill="${fill}" stroke="${O}" stroke-width="2.5" stroke-linejoin="round"/>`; };
  return `
<defs>${shadow('r0')}${lg('r0B', [[0, '#ffffff'], [1, '#dfe6ef']])}</defs>
<g filter="url(#r0sh)">
  <path d="M14 24 H110 Q118 24 118 32 V80 Q118 88 110 88 H50 L30 106 L32 88 H14 Q6 88 6 80 V32 Q6 24 14 24 Z" fill="url(#r0B)" stroke="${O}" stroke-width="4" stroke-linejoin="round"/>
  ${star(30, 56, 13, '#ffcf3a')}${star(62, 56, 13, '#ffcf3a')}${star(94, 56, 13, '#e3e7ec')}
</g>`;
})());
