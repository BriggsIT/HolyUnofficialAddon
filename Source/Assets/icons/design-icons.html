<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design assistant icons</title>
<!--
  The design assistant's round buttons on the game design screen (UI/DesignAssist): Assist and its options (first
  page), Platforms (platform page), and the icon the game's own Auto Design Settings wears (design focus page).
  Round like the game's own round buttons on that screen. Kept apart from update-icons.html so rendering these
  doesn't redraw every other icon.
  Render with: ..\logos\render-logos.ps1 -Page ..\icons\design-icons.html -Size 128 -NoJson   (PNGs go to png\)
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #sheet { display: grid; grid-template-columns: repeat(8, 128px); grid-auto-rows: 128px; }
  #sheet svg { width: 128px; height: 128px; display: block; }
  #meta { display: none; }
</style>
</head>
<body>
<div id="sheet"></div>
<pre id="meta"></pre>
<script>
const O = '#1c1d24';
const ICONS = [];
const add = (id, svg) => ICONS.push({ id, name: id, svg });
const stops = list => list.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('');
const lg = (id, list, d = [0, 0, 0, 1]) => `<linearGradient id="${id}" x1="${d[0]}" y1="${d[1]}" x2="${d[2]}" y2="${d[3]}">${stops(list)}</linearGradient>`;
const shadow = p => `<filter id="${p}sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".35"/></filter>`;

// The round button: a white face with a grey rim, lit from above.
function round(p) {
  return `<defs>${lg(p + 'rim', [[0, '#f4f6f8'], [1, '#9aa3ae']])}${lg(p + 'face', [[0, '#ffffff'], [0.6, '#f1f3f6'], [1, '#d9dee5']])}</defs>
<circle cx="64" cy="65" r="60" fill="#000" fill-opacity=".25"/>
<circle cx="64" cy="63" r="59" fill="url(#${p}rim)" stroke="#4b515a" stroke-width="3"/>
<circle cx="64" cy="63" r="50" fill="url(#${p}face)" stroke="#aab2bc" stroke-width="2"/>
<ellipse cx="64" cy="34" rx="34" ry="14" fill="#fff" fill-opacity=".7"/>`;
}

// A five-pointed star around (x, y).
function star(x, y, r, fill, sw = 4) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.45;
    pts.push(`${(x + rr * Math.cos(a)).toFixed(1)},${(y + rr * Math.sin(a)).toFixed(1)}`);
  }
  return `<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${O}" stroke-width="${sw}" stroke-linejoin="round"/>`;
}

// A four-pointed sparkle around (x, y).
function sparkle(x, y, r, fill) {
  const k = r * 0.28;
  return `<path d="M${x} ${y - r} Q${x + k} ${y - k} ${x + r} ${y} Q${x + k} ${y + k} ${x} ${y + r} Q${x - k} ${y + k} ${x - r} ${y} Q${x - k} ${y - k} ${x} ${y - r} Z" fill="${fill}" stroke="${O}" stroke-width="2.5" stroke-linejoin="round"/>`;
}

/* Assist: a magic wand with a gold star, over a game pad */
add('design-assist', `
${round('da')}
<defs>${shadow('da')}${lg('daS', [[0, '#fff3a6'], [1, '#f2a516']])}${lg('daW', [[0, '#4a5262'], [1, '#1f232b']], [0, 0, 1, 1])}${lg('daP', [[0, '#7cc4ff'], [1, '#2a6fd0']])}</defs>
<g filter="url(#dash)">
  <rect x="30" y="68" width="56" height="30" rx="14" fill="url(#daP)" stroke="${O}" stroke-width="3.5"/>
  <path d="M42 77 V89 M36 83 H48" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="72" cy="80" r="3.5" fill="#fff"/>
  <circle cx="78" cy="87" r="3.5" fill="#fff"/>
  <path d="M44 100 L82 50" stroke="${O}" stroke-width="12" stroke-linecap="round"/>
  <path d="M44 100 L82 50" stroke="url(#daW)" stroke-width="7" stroke-linecap="round"/>
  <path d="M74 60.5 L80.5 52" stroke="#fff" stroke-width="7"/>
  ${star(86, 42, 19, 'url(#daS)', 3.5)}
  ${sparkle(103, 70, 9, '#c9a2ff')}
  ${sparkle(58, 33, 7, '#8fe0ff')}
</g>
`);

/* Options: a cog with a small gold star */
add('design-options', (() => {
  const teeth = [];
  for (let i = 0; i < 8; i++) {
    teeth.push(`<rect x="-8" y="-37" width="16" height="16" rx="3" transform="rotate(${i * 45})" fill="url(#doG)" stroke="${O}" stroke-width="3.5"/>`);
  }
  return `
${round('do')}
<defs>${shadow('do')}${lg('doG', [[0, '#9aa6b6'], [1, '#4f5a6a']])}${lg('doS', [[0, '#fff3a6'], [1, '#f2a516']])}</defs>
<g filter="url(#dosh)">
  <g transform="translate(60 68)">
    ${teeth.join('')}
    <circle r="25" fill="url(#doG)" stroke="${O}" stroke-width="3.5"/>
    <circle r="10" fill="#eef1f5" stroke="${O}" stroke-width="3.5"/>
  </g>
  ${star(96, 32, 14, 'url(#doS)', 3)}
</g>
`;
})());

/* Platforms: a handheld and a console with a gold star */
add('design-platforms', `
${round('dp')}
<defs>${shadow('dp')}${lg('dpA', [[0, '#5f6878'], [1, '#2b3039']])}${lg('dpB', [[0, '#ffffff'], [1, '#c9d0da']])}${lg('dpC', [[0, '#7cc4ff'], [1, '#2a6fd0']])}${lg('dpS', [[0, '#fff3a6'], [1, '#f2a516']])}</defs>
<g filter="url(#dpsh)">
  <rect x="22" y="56" width="58" height="36" rx="7" fill="url(#dpA)" stroke="${O}" stroke-width="3.5"/>
  <rect x="30" y="65" width="26" height="5" rx="2.5" fill="#15181d"/>
  <circle cx="70" cy="80" r="4" fill="#7ee05a"/>
  <rect x="62" y="36" width="36" height="56" rx="7" fill="url(#dpB)" stroke="${O}" stroke-width="3.5"/>
  <rect x="68" y="43" width="24" height="22" rx="3" fill="url(#dpC)" stroke="${O}" stroke-width="2.5"/>
  <path d="M74 76 V84 M70 80 H78" stroke="${O}" stroke-width="3" stroke-linecap="round"/>
  <circle cx="88" cy="78" r="3.5" fill="#e8761c"/>
  ${star(96, 32, 14, 'url(#dpS)', 3)}
</g>
`);

/* Design focus (the game's Auto Design Settings, which also sets the work priorities): three sliders with a gold star */
add('design-focus', (() => {
  const rows = [[44, 50], [66, 82], [88, 38]];
  const bars = rows.map(([y, x]) => `
  <rect x="26" y="${y - 5}" width="64" height="10" rx="5" fill="#2b3039" stroke="${O}" stroke-width="3"/>
  <rect x="28" y="${y - 3}" width="${x - 28}" height="6" rx="3" fill="url(#dfB)"/>
  <circle cx="${x}" cy="${y}" r="10" fill="url(#dfK)" stroke="${O}" stroke-width="3.5"/>`).join('');
  return `
${round('df')}
<defs>${shadow('df')}${lg('dfB', [[0, '#7cc4ff'], [1, '#2a6fd0']])}${lg('dfK', [[0, '#ffffff'], [1, '#c9d0da']])}${lg('dfS', [[0, '#fff3a6'], [1, '#f2a516']])}</defs>
<g filter="url(#dfsh)">${bars}
  ${star(98, 34, 14, 'url(#dfS)', 3)}
</g>
`;
})());

document.getElementById('sheet').innerHTML = ICONS.map(i => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">${i.svg}</svg>`).join('');
document.getElementById('meta').textContent = JSON.stringify(ICONS.map(i => ({ id: i.id, name: i.name })));
</script>
</body>
</html>
