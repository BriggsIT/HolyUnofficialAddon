<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company logos</title>
<!--
  The addon's own company logos: each is drawn in a 128x128 space and rendered at 256x256.
  render-logos.ps1 screenshots this page with headless Edge, cuts it into png\<id>.png and writes logos.json.
  The game numbers the logos in this order (1000, 1001, ...), so only ever ADD new logos at the end:
  moving or removing one would change the logo in existing saves.
  Open this file in a browser with #preview to see them with their names.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #sheet { display: grid; grid-template-columns: repeat(8, 256px); grid-auto-rows: 256px; }
  #sheet svg { width: 256px; height: 256px; display: block; }
  #meta { display: none; }
  body.preview { background: #2b3445; font: 13px "Segoe UI", sans-serif; color: #e9edf2; padding: 16px; }
  body.preview #sheet { grid-template-columns: repeat(6, 270px); grid-auto-rows: 290px; gap: 10px; }
  body.preview #sheet figure { margin: 0; text-align: center; }
  body.preview #sheet figure:nth-child(odd) { background: #e9edf2; color: #2b3445; border-radius: 8px; }
</style>
</head>
<body>
<div id="sheet"></div>
<pre id="meta"></pre>
<script>
const O = '#1c1d24';
const LOGOS = [];
const f2 = v => +(+v).toFixed(2);
const pts = list => list.map(p => f2(p[0]) + ',' + f2(p[1])).join(' ');

// Every logo gets the same set of effects, named after its prefix p: sh (drop shadow), bv (bevel), tx (lit, shadowed
// wordmark), ss (small text shadow) and gl (glow).
function fx(p) {
  return `
<filter id="${p}sh" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000" flood-opacity=".45"/></filter>
<filter id="${p}bv" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"/>
  <feSpecularLighting in="b" surfaceScale="3" specularConstant=".8" specularExponent="20" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
  <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
  <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".6" k4="0"/>
</filter>
<filter id="${p}tx" x="-15%" y="-40%" width="130%" height="180%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation=".5" result="b"/>
  <feSpecularLighting in="b" surfaceScale="1.8" specularConstant=".8" specularExponent="18" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="45"/></feSpecularLighting>
  <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
  <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0" result="lit"/>
  <feDropShadow in="lit" dx="0" dy="1.3" stdDeviation=".8" flood-color="#000" flood-opacity=".55"/>
</filter>
<filter id="${p}ss" x="-10%" y="-40%" width="120%" height="180%"><feDropShadow dx="0" dy=".9" stdDeviation=".6" flood-color="#000" flood-opacity=".55"/></filter>
<filter id="${p}gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
}

const add = (id, name, p, body) => LOGOS.push({ id, name, svg: `<defs>${fx(p)}</defs>${body}` });
const stops = list => list.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a === undefined ? '' : ` stop-opacity="${a}"`}/>`).join('');
const lg = (id, list, d = [0, 0, 0, 1]) => `<linearGradient id="${id}" x1="${d[0]}" y1="${d[1]}" x2="${d[2]}" y2="${d[3]}">${stops(list)}</linearGradient>`;
const rg = (id, list, c = [.5, .5, .5]) => `<radialGradient id="${id}" cx="${c[0]}" cy="${c[1]}" r="${c[2]}">${stops(list)}</radialGradient>`;

// The emblem is drawn in the full 128 space and shrunk into the top of the logo, above the wordmark.
const emb = (p, svg, s = .64, cy = 44) => `<g filter="url(#${p}sh)"><g transform="translate(64 ${cy}) scale(${s}) translate(-64 -64)">${svg}</g></g>`;

// Wordmark line; squeezed to fit (data-fit) once the page has laid it out.
function word(p, txt, o) {
  const ls = o.ls || 0;
  const a = [`x="${f2((o.x ?? 64) + ls / 2)}"`, `y="${o.y}"`, 'text-anchor="middle"', `font-family="${o.font}"`, `font-size="${o.size}"`,
    `font-weight="${o.weight ?? 700}"`, `fill="${o.fill}"`, `data-fit="${o.fit ?? 118}"`];
  if (ls) a.push(`letter-spacing="${ls}"`);
  if (o.style) a.push(`font-style="${o.style}"`);
  if (o.stroke !== 'none') a.push(`stroke="${o.stroke || O}" stroke-width="${o.sw ?? 2.6}" stroke-linejoin="round" paint-order="stroke"`);
  a.push(`filter="url(#${p}${o.fx || 'tx'})"`);
  return `<text ${a.join(' ')}>${txt}</text>`;
}
const sub = (p, txt, o) => word(p, txt, Object.assign({ y: 120, size: 11, ls: 3.5, font: "Bahnschrift, 'Segoe UI', sans-serif", sw: 2.2, fx: 'ss' }, o));

function star(cx, cy, n, ro, ri, rotDeg = -90) {
  const p = [];
  for (let i = 0; i < 2 * n; i++) {
    const r = i % 2 ? ri : ro, a = (rotDeg + i * 180 / n) * Math.PI / 180;
    p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts(p);
}
function hex(cx, cy, r, flat = false) {
  const p = [];
  for (let i = 0; i < 6; i++) {
    const a = ((flat ? 0 : -90) + 60 * i) * Math.PI / 180;
    p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts(p);
}
function spark(x, y, r, fill) {
  const k = r * 0.28;
  return `<path d="M${x} ${y - r} L${x + k} ${y - k} L${x + r} ${y} L${x + k} ${y + k} L${x} ${y + r} L${x - k} ${y + k} L${x - r} ${y} L${x - k} ${y - k} Z" fill="${fill}"/>`;
}
// Lines radiating from a centre, e.g. strands of a mane.
function rays(cx, cy, n, r1, r2, rot = 0, jitter = 0) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = (rot + i * 360 / n) * Math.PI / 180, a1 = r1 + (i % 3) * jitter, a2 = r2 - (i % 4) * jitter;
    s += `<line x1="${f2(cx + a1 * Math.cos(a))}" y1="${f2(cy + a1 * Math.sin(a))}" x2="${f2(cx + a2 * Math.cos(a))}" y2="${f2(cy + a2 * Math.sin(a))}"/>`;
  }
  return s;
}
// Ellipse with a furry, zig-zag edge.
function fur(cx, cy, rx, ry, n, amp) {
  const p = [];
  for (let i = 0; i < n * 2; i++) {
    const a = i * Math.PI / n, k = i % 2 ? 1 : 1 + amp / Math.min(rx, ry);
    p.push([cx + rx * k * Math.cos(a), cy + ry * k * Math.sin(a)]);
  }
  return pts(p);
}
function cub(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [0, 1].map(k => u * u * u * p0[k] + 3 * u * u * t * p1[k] + 3 * u * t * t * p2[k] + t * t * t * p3[k]);
}
let seed = 11;
const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
// Rows of small arcs, used as scales and feathers.
function scallops(x0, x1, y0, y1, dx, dy, r, colour, width = 1, op = 1) {
  let s = '';
  for (let y = y0, row = 0; y <= y1; y += dy, row++) {
    for (let x = x0 + (row % 2 ? dx / 2 : 0); x <= x1; x += dx) s += `M${f2(x - r)} ${f2(y)} a${r} ${r} 0 0 0 ${2 * r} 0 `;
  }
  return `<path d="${s}" fill="none" stroke="${colour}" stroke-width="${width}" stroke-opacity="${op}" stroke-linecap="round"/>`;
}

/* 13 */ add('quilldice', 'Quill & Dice', 'qd', (() => {
  const P0 = [108, 6], P1 = [74, 52], P2 = [22, 120];
  const q = t => [0, 1].map(k => (1 - t) * (1 - t) * P0[k] + 2 * (1 - t) * t * P1[k] + t * t * P2[k]);
  const qt = t => [0, 1].map(k => 2 * (1 - t) * (P1[k] - P0[k]) + 2 * t * (P2[k] - P1[k]));
  const END = .64, up = [], down = [];
  let barbs = '';
  for (let t = 0; t <= END + .0001; t += .02) {
    const [x, y] = q(t), [tx, ty] = qt(t), l = Math.hypot(tx, ty), nx = -ty / l, ny = tx / l;
    const k = Math.pow(Math.sin(Math.PI * Math.min(1, t / END)), .7), wu = 14 * k * (t > .32 && t < .37 ? .55 : 1), wd = 9 * k;
    up.push([x + nx * wu, y + ny * wu]);
    down.unshift([x - nx * wd, y - ny * wd]);
    if (t > .02 && t < END - .02) {
      const [bx, by] = q(Math.max(0, t - .035));
      barbs += `<path d="M${f2(x)} ${f2(y)} L${f2(bx + nx * wu * .95)} ${f2(by + ny * wu * .95)} M${f2(x)} ${f2(y)} L${f2(bx - nx * wd * .95)} ${f2(by - ny * wd * .95)}"/>`;
    }
  }
  return `
<defs>
${lg('qdV', [[0, '#c9a6f2'], [.5, '#6a3fa0'], [1, '#2e1856']], [1, 0, 0, 1])}

${emb('qd', `

<path d="M27 114 L22 120" stroke="${O}" stroke-width=".8"/>
<g stroke="${O}" stroke-width="2.2" stroke-linejoin="round">
  <polygon points="56,56 80,68 56,80 32,68" fill="#ffffff"/>
  <polygon points="32,68 56,80 56,108 32,96" fill="#ebe4d2"/>
  <polygon points="56,80 80,68 80,96 56,108" fill="#cfc5ad"/>
</g>
<path d="M33.5 68 L56 57 L78.5 68" stroke="#fff" stroke-width="1" fill="none"/>

<g fill="${O}"><circle cx="38.7" cy="79.2" r="2.8"/><circle cx="49.3" cy="96.8" r="2.8"/><circle cx="62" cy="84" r="2.6"/><circle cx="68" cy="88" r="2.6"/><circle cx="74" cy="92" r="2.6"/></g>
`)}
${word('qd', 'QUILL &amp; DICE', { y: 112, size: 19, ls: .5, style: 'italic', font: "'Palatino Linotype', Georgia, serif", fill: 'url(#qdT)', stroke: '#1e0f36' })}

  let floor = '';
  for (let x = 8; x < 120; x += 8) floor += `<rect x="${x}" y="111" width="8" height="7" fill="${(x / 8) % 2 ? '#bfe3f7' : '#9fd0ee'}"/>`;
  const snow = [[12, 12], [24, 30], [104, 14], [112, 40], [14, 56], [110, 72], [18, 80]].map(([x, y]) => `<rect x="${x}" y="${y}" width="2.5" height="2.5" fill="#d6efff"/>`).join('');
  return `
<defs>${lg('pbBg', [[0, '#164f80'], [1, '#3b9ad6']])}<clipPath id="pbC"><rect x="5" y="5" width="118" height="118" rx="17"/></clipPath></defs>
<g filter="url(#pbsh)"><rect x="4" y="4" width="120" height="120" rx="18" fill="url(#pbBg)" stroke="${O}" stroke-width="2.4" filter="url(#pbbv)"/></g>
<g clip-path="url(#pbC)" shape-rendering="crispEdges">${snow}${floor}<rect x="8" y="111" width="112" height="1.5" fill="#fff"/></g>
<g shape-rendering="crispEdges">${bear}${text}</g>
`;
})());

const sheet = document.getElementById('sheet');
const preview = location.hash === '#preview';
if (preview) document.body.className = 'preview';
sheet.innerHTML = LOGOS.map(l => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">${l.svg}</svg>`;
  return preview ? `<figure>${svg}<figcaption>${l.name}</figcaption></figure>` : svg;
}).join('');
// Squeeze any line of text that is wider than its space.
document.querySelectorAll('text[data-fit]').forEach(t => {
  const room = +t.dataset.fit;
  if (t.getComputedTextLength() > room) {
    t.setAttribute('textLength', room);
    t.setAttribute('lengthAdjust', 'spacingAndGlyphs');
  }
});
document.getElementById('meta').textContent = JSON.stringify(LOGOS.map(l => ({ id: l.id, name: l.name })));
</script>
</body>
</html>
